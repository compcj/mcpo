name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              run: pip install uv

            - name: Verify release tag and extract its changelog entry
              run: |
                  version=$(uv version --short)
                  test "$GITHUB_REF_NAME" = "v${version/+f/f}"
                  awk -v entry="[${GITHUB_REF_NAME#v}]" '
                      /^## \[/ { if (found) exit; found = ($2 == entry); next }
                      found { print }
                  ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
                  test -s "$RUNNER_TEMP/release-notes.md"

            - name: Build Python distributions
              run: uv build --no-sources

            - name: Publish GitHub release and distributions
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
                      --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
